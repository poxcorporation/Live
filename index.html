<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmisión En Vivo HLS</title>
  <!-- HLS.js para navegadores que no lo soportan de forma nativa -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    body {
      background-color: #000;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Contenedor forzado estrictamente a 16:9 */
    .player-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background-color: #111;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    /* Reproductor nativo encajado en 16:9 */
    video {
      width: 100%;
      height: 100%;
      /* 'contain' mantiene las barras negras a los lados para videos 9:16 */
      /* Cambia a 'cover' si prefieres recortar el video para que llene todo el 16:9 */
      object-fit: contain; 
    }
  </style>
</head>
<body>

  <div class="player-container">
    <!-- Atributo 'controls' para usar el reproductor predeterminado del sistema -->
    <video id="live-player" controls autoplay playsinline></video>
  </div>

  <script>
    const video = document.getElementById('live-player');
    const streamUrl = 'live.m3u8';

    if (Hls.isSupported()) {
      // Para Chrome, Edge, Firefox
      const hls = new Hls({
        liveSyncDurationCount: 3,
        enableWorker: true
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
    } 
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Para Safari nativo (iOS / iPadOS / macOS)
      video.src = streamUrl;
    }
  </script>

</body>
</html>
